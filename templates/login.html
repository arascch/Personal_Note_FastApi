<html>
    <head>
        <title>Login-Personal Notes</title>
        <script src="https://cdn.tailwindscss.com"></script>
    </head>
    <body>
        <div class="bg-gray-100 flex items-center justify-center h-screen">
            <div class="bg-white p-8 rounded shadow-md w-96">
                <h2 class="text-2xl font-bold mb-6 text-center">Welcome Back</h2>

                <form action="/login" method="post" class="flex flex-col space-y-4">
                    <div>
                        <label class="text-sm font-semibold text-gray-600"> Username</label>
                        <input type="text" name="Username" required class="w-full border border-gray-300 p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-gray-600">Password</label>
                        <input type="password" name="password" required class="w-full border border-gray-300 p-2 rounded mt-1">
                    </div>
                    
                    <button type="submit" class="bg-green-500 text-white font-bold py-2 rounded hover:bg-green-600 transition"></button>

                </form>

            </div>

        </div>
    </body>
</html>
