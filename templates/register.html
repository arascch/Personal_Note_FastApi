<html>
<head>
    <title>Register - Personal Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Create an account</h2>
        <form action="/register" method="post" class="flex flex-col space-y-4">
            <div>
                <label class="text-sm font-semibold text-gray-600">Username</label>
                <input type="text" name="username" required class="w-full border border-gray-300 p-2 rounded mt-1">
            </div>
            <div>
                <label class="text-sm font-semibold text-gray-600">Password</label>
                <input type="password" name="password" required class="w-full border border-gray-300 p-2 rounded mt-1">
            </div>
            <button type="submit" class="bg-blue-500 text-white font-bold py-2 rounded hover:bg-blue-600 transition">
                register
            </button>
        </form>
    </div>
    
</body>
</html>
