<html>
    <head>
        <title>Dashboard - Personal Notes</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 p-8">
        <div class="max-w-2xl mx-auto space-y-8">
            <div class="bg-white p-6 rounded shadow-md">
                <h2 class="text-xl font-bold mb-4"> Write a new note</h2>
                <form action="/notes" method="post" class="flex flex-col space-y-4">
                    <input type="text" name="title" placeholder="Note Title" required 
                            class="border border-gray-300 p-2 rounded">
                    <textarea name="content" placeholder="Write your note here .. " required
                              class="border border-gray-300 p-2 rounded h-24"></textarea>
                    <button type="submit" class="bg-blue-500" text-white font-bold py-2 rounded hover:bg-blue-600>
                        Save Note
                    </button>
                </form>
            </div>

            <div class="space-y-4">
                <h2 class="text-xl-font-bold"> Your Save Notes</h2>
                {% for note in notes  %}
                  <div class="bg-white p-4 rounded shadow">
                    <h3 class="font-bold text-lg">{{note.title}}</h3>
                    <p class="text-gray-700 mt-1">{{note.content}}</p>
                  </div>
                {% endfor %}

            </div>
        </div>
    </body>
</html>
